name: "Automated PR Reviewer"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: "Subagent PR Review & Verification"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run Unit Tests"
        run: npm test

      - name: "Run TypeScript Typecheck"
        run: npx tsc --noEmit

      - name: "Run Subagent PR Reviewer"
        id: pr_reviewer
        run: |
          npx tsx scripts/reviewer/index.ts --ci > reviewer-report.md || true
          cat reviewer-report.md
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: "Post PR Review Summary Comment"
        uses: actions/github-script@v7
        if: always() && github.event.pull_request.number != 0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = "### 🤖 Automated PR Reviewer\n\nReview report could not be generated.";
            try {
              if (fs.existsSync('reviewer-report.md')) {
                report = fs.readFileSync('reviewer-report.md', 'utf8');
              }
            } catch (err) {
              console.error("Failed to read reviewer report:", err);
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Automated PR Review Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }
